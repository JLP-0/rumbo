[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jefferson Lopez Porras", email = "jefferson.lopez.porras21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errores, imports, bugs comunes, sintaxis moderna

[tool.pytest.ini_options]
testpaths = ["tests"]